<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#e7d3b5"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>日語單詞</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+JP:wght@500;600;700&display=swap"/>
<style>
:root{
  --bg:#e7d3b5;--paper:#f7f0e0;--ink:#2a1b12;--muted:#8d735c;
  --accent:#d96a28;--gold:#b0893a;--line:#ddcbb3;--ok:#6a8a55;--title:#6b4a28;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Serif JP","Hiragino Mincho ProN","Songti TC",serif;
  -webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;min-height:100dvh;
  background:radial-gradient(900px 420px at 10% -20%,rgba(255,255,255,.35),transparent 55%),var(--bg)}
.appbar{padding:calc(12px + env(safe-area-inset-top)) 18px 10px;display:flex;justify-content:space-between;align-items:center}
.appbar h1{font-size:15px;margin:0;letter-spacing:.14em;color:var(--title);font-weight:600}
.icon-btn{background:var(--paper);border:1px solid var(--line);color:var(--ink);width:40px;height:40px;border-radius:14px;box-shadow:0 1px 0 rgba(255,255,255,.55)}
.screen{display:none;flex:1;flex-direction:column;min-height:0;padding:6px 16px 12px}
.screen.on{display:flex}
.card{
  position:relative;flex:1;min-height:52vh;overflow:hidden;
  background:linear-gradient(180deg,#fbf6ea 0%,#f3e6d0 100%);
  border-radius:28px;display:flex;flex-direction:column;justify-content:center;text-align:center;
  padding:56px 22px 28px;
  box-shadow:0 0 0 1px rgba(90,60,30,.08),0 12px 28px rgba(90,50,20,.12);
}
.corner{position:absolute;top:18px;left:22px;text-align:left;line-height:1.08;color:var(--gold)}
.corner .mark{font-size:22px;letter-spacing:.04em}
.corner .trans{font-size:15px;opacity:.92;margin-top:2px}
.group-tag{position:absolute;top:22px;right:22px;font-family:"Noto Sans TC","PingFang TC",sans-serif;font-size:12px;letter-spacing:.04em;color:var(--muted)}
.kana{font-size:clamp(1.35rem,5.2vw,1.9rem);margin:0;color:var(--ink);font-weight:500;letter-spacing:.08em}
.kanji{font-size:clamp(2.05rem,8.4vw,3.2rem);margin:10px 0 0;color:var(--ink);line-height:1.2;font-weight:600}
.zh{font-size:1.05rem;margin:26px 0 0;font-family:"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink);line-height:1.55}
.zh.hidden,.ex-zh.hidden{filter:blur(9px);user-select:none}
.ex{margin:28px auto 0;max-width:22rem;font-size:1.02rem;line-height:1.7;color:var(--ink)}
.ex-zh{margin-top:8px;font-family:"Noto Sans TC",sans-serif;font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.actions{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;margin-top:14px}
.btn{border:0;border-radius:16px;padding:14px 8px;font-size:15px;font-family:"Noto Sans TC","PingFang TC",sans-serif;min-height:44px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.55}
nav{display:grid;grid-template-columns:1fr 1fr 1fr;padding:8px 10px calc(14px + env(safe-area-inset-bottom))}
nav button{background:0;border:0;color:var(--muted);padding:12px 4px;font-family:"Noto Sans TC",sans-serif;font-size:14px}
nav button.on{color:var(--title);font-weight:600}
.hint{font-family:"Noto Sans TC",sans-serif;color:var(--muted);font-size:14px;padding:0 4px 12px;line-height:1.5}
.row-btns{display:flex;gap:8px;margin-bottom:12px}
.group-row{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.group-main{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 4px;border:0;background:transparent;text-align:left;font-family:"Noto Sans TC",sans-serif;color:inherit}
.del-btn{width:40px;height:40px;flex-shrink:0;border:0;background:transparent;color:var(--muted);border-radius:10px;font-size:18px}
.check{width:26px;height:26px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;color:transparent;flex-shrink:0}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#3a2e26;color:#f7f0e0;padding:10px 16px;border-radius:999px;font-size:13px;display:none;font-family:"Noto Sans TC",sans-serif;max-width:min(92vw,360px);text-align:center;z-index:20}
.panel p{font-family:"Noto Sans TC",sans-serif;color:var(--muted);line-height:1.6;font-size:14px}
.file-btn{display:block;width:100%;margin-top:10px}
.import-opt{display:flex;align-items:flex-start;gap:10px;font-family:"Noto Sans TC",sans-serif;font-size:14px;color:var(--ink);margin:8px 0}
.import-opt input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.list{min-height:0;flex:1;overflow-y:auto}
@media (prefers-reduced-motion:reduce){.zh.hidden,.ex-zh.hidden{filter:none;opacity:.12}}
</style>
</head>
<body>
<header class="appbar"><h1>日語單詞</h1><button class="icon-btn" id="speakBtn" aria-label="朗讀">♪</button></header>
<section id="home" class="screen on">
  <div class="card" id="card">
    <div class="corner"><div class="mark" id="mark"></div><div class="trans" id="trans"></div></div>
    <div class="group-tag" id="meta"></div>
    <p class="kana" id="kana">ようこそ</p>
    <p class="kanji" id="kanji"></p>
    <p class="zh" id="zh"></p>
    <div class="ex" id="ex"></div>
  </div>
  <div class="actions">
    <button class="btn ghost" id="revealBtn">隱藏意思</button>
    <button class="btn primary" id="nextBtn">換一個</button>
    <button class="btn ghost" id="againBtn">再出一詞</button>
  </div>
</section>
<section id="groups" class="screen">
  <p class="hint" id="groupHint">勾選的課會進入抽詞。</p>
  <div class="row-btns">
    <button class="btn ghost" id="allOn">全選</button>
    <button class="btn ghost" id="allOff">全不選</button>
  </div>
  <div class="list" id="groupList"></div>
</section>
<section id="import" class="screen">
  <div class="panel">
    <p>請匯入「標準格式2號」Excel。<strong style="color:var(--ink);font-weight:600">每一張工作表會變成一個獨立 group</strong>，名稱等於工作表名（例如 int_ch1、int_ch13）。<strong style="color:var(--ink);font-weight:600">絕不會用檔名當 group。</strong>若名稱已存在，會自動改成 int_ch6_2。</p>
    <p>欄位：A 課標、B 自／他、C 序號、D 假名、E 漢字、F 品詞、G 中譯、H 日文例句、I 例句中譯。沒有標題列。</p>
    <label class="import-opt"><input type="checkbox" id="replaceChk" checked/><span>清空現有 group 再匯入（建議，避免舊檔名那一組留下來）</span></label>
    <input type="file" id="fileInput" accept=".xlsx,.xls" hidden/>
    <button class="btn primary file-btn" id="pickFile">匯入 Excel</button>
    <button class="btn ghost file-btn" id="resetBtn">還原 24 課預設詞彙</button>
  </div>
</section>
<nav>
  <button class="on" data-tab="home">單詞</button>
  <button data-tab="groups">Groups</button>
  <button data-tab="import">匯入</button>
</nav>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const KEY='jp-vocab-app-v6';
const state={data:{groups:[]},current:null,revealed:true};
const mem={};
function sget(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
function save(){sset(KEY,JSON.stringify(state.data))}
function wordCount(d){return (d&&d.groups||[]).reduce((n,g)=>n+(g.words||[]).length,0)}
function displayGroupName(name){
  const m=String(name||'').match(/^(?:int_)?ch(\d+)$/i);
  return m?('第'+Number(m[1])+'課'):name;
}
function cleanForm(s){
  s=String(s||'').trim();
  if(!s||s==='-')return '';
  s=s.replace(/\|\s*ます\s*\|/g,'').replace(/\|\s*辞\s*\|/g,'');
  s=s.replace(/\[する\]|［する］/g,'');
  s=s.replace(/[［\[][^］\]]*[］\]]/g,'').replace(/（[^）]*）|\([^)]*\)/g,'');
  return s.replace(/\s+/g,'').trim();
}
function uniqueGroupName(base, existing){
  const names=new Set(existing);
  if(!names.has(base)) return base;
  let i=2; while(names.has(base+'_'+i)) i++;
  return base+'_'+i;
}
function parseStd2Sheet(rows){
  const words=[];
  rows.forEach(row=>{
    if(!Array.isArray(row)) return;
    const kanaRaw=String(row[3]||'').trim();
    const kanjiRaw=String(row[4]||'').trim();
    const zh=String(row[6]||'').trim();
    const num=row[2];
    if(!kanaRaw&&!kanjiRaw) return;
    if(!(typeof num==='number'||/^\d+$/.test(String(num)))) { if(!zh) return; }
    const kana=cleanForm(kanaRaw)||kanaRaw;
    const kanji=cleanForm(kanjiRaw);
    words.push({
      kana, kanji: kanji&&kanji!=='-'?kanji:'',
      pos:String(row[5]||'').trim(), zh,
      mark:String(row[0]||'').trim(),
      trans:String(row[1]||'').trim(),
      exampleJp:String(row[7]||'').trim(),
      exampleZh:String(row[8]||'').trim(),
      speech: kana || kanji
    });
  });
  return words;
}
function parseStd2Workbook(wb, existingNames){
  const names=[...existingNames];
  const groups=[];
  (wb.SheetNames||[]).forEach((sheetName, idx)=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:''});
    const words=parseStd2Sheet(rows);
    if(!words.length) return;
    const name=uniqueGroupName(sheetName||('sheet_'+(idx+1)), names);
    names.push(name);
    groups.push({id:'g'+Date.now()+'_'+idx+'_'+Math.random().toString(36).slice(2,7), name, words, active:true});
  });
  return groups;
}
function activeWords(){
  return (state.data.groups||[]).filter(g=>g.active).flatMap(g=>(g.words||[]).map(w=>({...w,groupName:g.name})));
}
function pickWord(){
  const pool=activeWords();
  if(!pool.length){state.current=null;render();return}
  let w,guard=0;
  do{w=pool[Math.floor(Math.random()*pool.length)]}
  while(pool.length>1&&state.current&&w.kana===state.current.kana&&++guard<8);
  state.current=w;state.revealed=true;render();
}
function render(){
  const w=state.current;
  const set=(id,t)=>{const el=document.getElementById(id);if(el)el.textContent=t||''};
  if(!w){
    set('meta','');set('mark','');set('trans','');
    set('kana','到 Groups 勾選至少一課');set('kanji','');set('zh','');
    document.getElementById('ex').innerHTML='';
    return;
  }
  const kana=cleanForm(w.kana)||w.kana||'';
  const kanji=cleanForm(w.kanji);
  const showKanji=kanji&&kanji!==kana&&kanji!=='-';
  set('mark',w.mark||'');
  set('trans',w.trans||'');
  set('meta',displayGroupName(w.groupName||''));
  set('kana',kana);
  set('kanji',showKanji?kanji:'');
  const zh=document.getElementById('zh');
  zh.textContent=w.zh||'';
  zh.classList.toggle('hidden',!state.revealed);
  const ex=document.getElementById('ex');
  if(w.exampleJp||w.exampleZh){
    ex.innerHTML=`${w.exampleJp?`<div>${w.exampleJp}</div>`:''}${w.exampleZh?`<div class="ex-zh${state.revealed?'':' hidden'}">${w.exampleZh}</div>`:''}`;
  }else{ex.innerHTML='';}
  document.getElementById('revealBtn').textContent=state.revealed?'隱藏意思':'顯示意思';
}
function renderGroups(){
  const gs=state.data.groups||[];
  const active=gs.filter(g=>g.active).length;
  document.getElementById('groupHint').textContent='勾選的課會進入抽詞。目前 '+active+' / '+gs.length+' 課。';
  const box=document.getElementById('groupList');
  if(!gs.length){box.innerHTML='<p class="hint">尚未有 group，請到匯入加入 Excel。</p>';return;}
  box.innerHTML=gs.map(g=>{
    const label=displayGroupName(g.name);
    const sub=(label!==g.name?g.name+' · ':'')+(g.words||[]).length+' 個單詞';
    return `<div class="group-row" data-id="${g.id}">
      <button type="button" class="group-main">
        <span><span style="display:block;font-weight:500">${label}</span>
        <span class="hint" style="padding:0;font-size:12px">${sub}</span></span>
        <span class="check ${g.active?'on':''}">✓</span>
      </button>
      <button type="button" class="del-btn" aria-label="刪除">×</button>
    </div>`;
  }).join('');
  box.querySelectorAll('.group-row').forEach(el=>{
    const id=el.dataset.id;
    el.querySelector('.group-main').onclick=()=>{
      const g=state.data.groups.find(x=>x.id===id);g.active=!g.active;save();renderGroups();
    };
    el.querySelector('.del-btn').onclick=()=>{
      state.data.groups=state.data.groups.filter(x=>x.id!==id);save();renderGroups();pickWord();
    };
  });
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function speak(){
  const w=state.current;if(!w||!speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(w.speech||w.kana);u.lang='ja-JP';u.rate=.9;speechSynthesis.speak(u);
}
document.getElementById('card').onclick=()=>{if(!state.current)return;state.revealed=!state.revealed;render()};
document.getElementById('revealBtn').onclick=e=>{e.stopPropagation();if(!state.current)return;state.revealed=!state.revealed;render()};
document.getElementById('nextBtn').onclick=pickWord;
document.getElementById('againBtn').onclick=pickWord;
document.getElementById('speakBtn').onclick=speak;
document.getElementById('allOn').onclick=()=>{state.data.groups.forEach(g=>g.active=true);save();renderGroups()};
document.getElementById('allOff').onclick=()=>{state.data.groups.forEach(g=>g.active=false);save();renderGroups()};
document.querySelectorAll('nav button').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
    document.getElementById(btn.dataset.tab).classList.add('on');
    if(btn.dataset.tab==='groups')renderGroups();
  };
});
document.getElementById('pickFile').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=async e=>{
  const file=e.target.files[0];e.target.value='';
  if(!file||typeof XLSX==='undefined'){toast('請先連網載入解析庫');return}
  try{
    const wb=XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:'array'});
    const replace=document.getElementById('replaceChk').checked;
    const existing=replace?[]:(state.data.groups||[]).map(g=>g.name);
    const imported=parseStd2Workbook(wb, existing);
    if(!imported.length){toast('找不到標準格式2號的工作表單詞');return}
    if(replace) state.data={groups:imported};
    else state.data.groups=(state.data.groups||[]).concat(imported);
    save();renderGroups();pickWord();
    const preview=imported.slice(0,3).map(g=>g.name).join('、');
    const more=imported.length>3?(' 等 '+imported.length+' 課'):'';
    const n=imported.reduce((s,g)=>s+g.words.length,0);
    toast('已匯入 '+imported.length+' 個 group（'+preview+more+'）、'+n+' 詞');
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==='groups'));
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
    document.getElementById('groups').classList.add('on');
  }catch(err){toast('無法讀取這個 Excel')}
};
document.getElementById('resetBtn').onclick=()=>{
  if(!window.DEFAULT_VOCAB){toast('還沒載入預設詞彙');return}
  state.data=JSON.parse(JSON.stringify(window.DEFAULT_VOCAB));
  save();renderGroups();pickWord();toast('已還原 '+window.DEFAULT_VOCAB.groups.length+' 個課次');
};
async function boot(){
  try{
    const r=await fetch('./vocab/default-groups.json?v=6');
    if(r.ok) window.DEFAULT_VOCAB=await r.json();
  }catch(e){}
  if(!window.DEFAULT_VOCAB||!wordCount(window.DEFAULT_VOCAB)){
    window.DEFAULT_VOCAB={groups:[]};
  }
  let stored=null;try{stored=JSON.parse(sget(KEY)||'null')}catch(e){}
  state.data=(stored&&wordCount(stored)>0)?stored:JSON.parse(JSON.stringify(window.DEFAULT_VOCAB));
  if(!stored||wordCount(stored)===0) save();
  renderGroups();pickWord();
}
boot();
</script>
</body>
</html>
