name: Build APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
      - "artifacts/index.html"
      - "src/data/default-groups.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Restore web assets if placeholders
        run: |
          GOOD=https://raw.githubusercontent.com/PotatoKKK/jp-vocab/81437d83dd6f4a32af256ebb22bb21747449c480
          mkdir -p android/app/src/main/assets/www/vocab
          if [ ! -f index.html ] || [ "$(wc -c < index.html)" -lt 1000 ]; then
            curl -fsSL "$GOOD/index.html" -o index.html
          fi
          cp -f index.html android/app/src/main/assets/www/index.html
          if [ ! -f vocab/default-groups.json ] || [ "$(wc -c < vocab/default-groups.json)" -lt 1000 ]; then
            curl -fsSL "$GOOD/vocab/default-groups.json" -o vocab/default-groups.json
          fi
          cp -f vocab/default-groups.json android/app/src/main/assets/www/vocab/default-groups.json
          test -f android/app/src/main/assets/www/index.html
          test -f android/app/src/main/assets/www/vocab/default-groups.json
          test "$(wc -c < android/app/src/main/assets/www/index.html)" -gt 1000
      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/jp-vocab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jp-vocab-apk
          path: dist/jp-vocab.apk
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: 日語單詞 Android
          prerelease: true
          files: dist/jp-vocab.apk
          body: |
            打開 App → 按「開啟解鎖單詞」→ 允許「顯示在其他應用程式上層」。
            之後每次解鎖手機，奶油紙單詞卡會跳出來。
            小米／華為請再允許自啟動與略過電池優化。
            本版解鎖後只跳一次；點「關閉」後不會再重試。
