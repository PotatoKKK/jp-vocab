name: Build APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
      - "index.html"
      - "vocab/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build vocab from base + v1.5 patch
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          base_url = "https://raw.githubusercontent.com/PotatoKKK/jp-vocab/81437d83dd6f4a32af256ebb22bb21747449c480/vocab/default-groups.json"
          base = json.load(urllib.request.urlopen(base_url))
          patch = json.loads(Path("vocab/example-patch-v15.json").read_text(encoding="utf-8"))
          m = {g["name"]: g for g in base["groups"]}
          n = 0
          for name, idx, jp, zh in patch:
              g = m.get(name)
              if not g or idx >= len(g.get("words") or []):
                  raise SystemExit(f"patch miss {name} {idx}")
              g["words"][idx]["exampleJp"] = jp
              g["words"][idx]["exampleZh"] = zh
              n += 1
          base["dataVersion"] = "v1.5"
          Path("vocab").mkdir(exist_ok=True)
          Path("vocab/default-groups.json").write_text(
              json.dumps(base, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          print("patched", n, "examples")
          PY
      - name: Sync web assets
        run: |
          mkdir -p android/app/src/main/assets/www/vocab
          cp -f index.html android/app/src/main/assets/www/index.html
          cp -f vocab/default-groups.json android/app/src/main/assets/www/vocab/default-groups.json
          cp -f vocab/example-patch-v15.json android/app/src/main/assets/www/vocab/example-patch-v15.json
          test -f android/app/src/main/assets/www/index.html
          test -f android/app/src/main/assets/www/vocab/default-groups.json
      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/jp-vocab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jp-vocab-apk
          path: dist/jp-vocab.apk
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: 日語單詞 Android
          prerelease: true
          files: dist/jp-vocab.apk
          body: |
            打開 App → 按「開啟解鎖單詞」→ 允許「顯示在其他應用程式上層」。
            之後每次解鎖手機，奶油紙單詞卡會跳出來。
            小米／華為請再允許自啟動與略過電池優化。
            詞庫例句已換成 Excel v1.5。
