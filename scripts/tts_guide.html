<div class="guide" id="ttsGuide">
  <p class="guide-title">喇叭沒聲音？</p>
  <p>單詞卡出現時<strong>不會自動發音</strong>，只有你點右上角喇叭才會唸。</p>
  <p>按了仍沒聲，多半是手機還沒裝「日語語音」：</p>
  <p>1. 開<strong>設定</strong> → <strong>一般管理</strong>（或「無障礙」）→ <strong>文字轉語音</strong></p>
  <p>2. 引擎選 Samsung 或 Google</p>
  <p>3. 下載／安裝「日語」語音，在同一頁按試聽</p>
  <p>4. 把<strong>媒體音量</strong>開大，回到本 App 再按喇叭</p>
</div>
